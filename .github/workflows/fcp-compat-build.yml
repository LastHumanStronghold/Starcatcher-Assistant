name: Build patched FCP 1.2.1
run-name: FCP 1.2.1 mixin compatibility build

on:
  push:
    branches: [ fcp-compat-build ]

permissions:
  contents: read

jobs:
  build-fcp:
    name: Build patched Frontline Combat Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Checkout FCP release source
        uses: actions/checkout@v4
        with:
          repository: CommissarMado/Frontline-Combat-Pack
          ref: 2b27abb905195a923edd412790d2fa77db5d8fcc
          path: fcp-source
          lfs: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: fcp-source/**/*.gradle*

      - name: Patch AmmoSupplierItem mixin
        working-directory: fcp-source
        shell: bash
        run: |
          cat > src/main/java/frontline/combat/fcp/mixins/AmmoSupplierItemMixin.java <<'EOF'
          package frontline.combat.fcp.mixins;

          import com.atsuishio.superbwarfare.item.ammo.AmmoSupplierItem;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResultHolder;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.Level;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          /**
           * Prevents Superb Warfare ammo-supplier items from being converted into
           * the abstract player ammo pool when right-clicked.
           *
           * AmmoSupplierItem inherits Item.use(). Injecting into Item avoids
           * Mixin trying to locate an inherited method as if it were declared
           * directly on AmmoSupplierItem. The runtime guard limits this change
           * to Superb Warfare ammo-supplier items only.
           */
          @Mixin(Item.class)
          public abstract class AmmoSupplierItemMixin {

              @Inject(method = "use", at = @At("HEAD"), cancellable = true)
              private void fcp$noAmmoPoolConversion(Level level, Player player, InteractionHand hand,
                                                    CallbackInfoReturnable<InteractionResultHolder<ItemStack>> cir) {
                  if (!((Object) this instanceof AmmoSupplierItem)) {
                      return;
                  }

                  cir.setReturnValue(InteractionResultHolder.pass(player.getItemInHand(hand)));
              }
          }
          EOF

          grep -q '@Mixin(Item.class)' src/main/java/frontline/combat/fcp/mixins/AmmoSupplierItemMixin.java
          grep -q 'method = "use"' src/main/java/frontline/combat/fcp/mixins/AmmoSupplierItemMixin.java
          grep -q 'instanceof AmmoSupplierItem' src/main/java/frontline/combat/fcp/mixins/AmmoSupplierItemMixin.java

      - name: Skip optional icon regeneration hook
        working-directory: fcp-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          source = p.read_text(encoding="utf-8")
          target = "tasks.named('processResources').configure { dependsOn 'renderVehicleIcons' }"
          if source.count(target) != 1:
              raise SystemExit("Expected optional renderVehicleIcons dependency line exactly once")
          source = source.replace(
              target,
              "// CI compatibility rebuild: keep committed vehicle icons; do not require the absent optional Python renderer."
          )
          p.write_text(source, encoding="utf-8")
          PY

      - name: Build FCP 1.2.1 patched
        working-directory: fcp-source
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build -Pmod_version=1.2.1-lhsfix1

      - name: Verify patched JAR contents
        working-directory: fcp-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar = Path("build/libs/fcp-1.2.1-lhsfix1.jar")
          if not jar.is_file():
              raise SystemExit(f"Missing output JAR: {jar}")
          with ZipFile(jar) as archive:
              names = set(archive.namelist())
              required = {
                  "frontline/combat/fcp/mixins/AmmoSupplierItemMixin.class",
                  "fcp.mixins.json",
                  "fcp.refmap.json",
                  "META-INF/mods.toml",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Missing expected JAR entries: " + ", ".join(missing))
              config = archive.read("fcp.mixins.json").decode("utf-8")
              if '"AmmoSupplierItemMixin"' not in config:
                  raise SystemExit("AmmoSupplierItemMixin is absent from fcp.mixins.json")
              refmap = archive.read("fcp.refmap.json")
              if not refmap:
                  raise SystemExit("fcp.refmap.json is empty")
          print(f"Verified {jar} ({jar.stat().st_size} bytes)")
          PY

      - name: Upload patched JAR
        uses: actions/upload-artifact@v4
        with:
          name: FCP-1.2.1-lhsfix1-Forge-1.20.1
          path: fcp-source/build/libs/fcp-1.2.1-lhsfix1.jar
          if-no-files-found: error
          retention-days: 14
